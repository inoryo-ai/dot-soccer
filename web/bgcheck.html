<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>背景の確認台 — 街・商店街・事務所（.soccer）</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<style>
/* 🔑 確認用。ゲーム本体には出ない。 */
.bgc { max-width: 1060px; margin: 0 auto; padding: calc(var(--px) * 8); }
.bgc-item { margin-bottom: calc(var(--px) * 10); }
.bgc-head { display: flex; gap: calc(var(--px) * 5); align-items: baseline; margin-bottom: calc(var(--px) * 3); }
.bgc-stage { position: relative; width: 960px; max-width: 100%; aspect-ratio: 16 / 9;
             border: var(--w-frame) solid var(--ui-edge); background: #10152a; }
.bgc-stage canvas { display: block; width: 100%; height: 100%; }
/* 🔑 中央58%＝手前にパネルが載る帯。ここに見せ場が無いかを確かめる */
.bgc-guide { position: absolute; top: 0; bottom: 0; left: 21%; right: 21%;
             border-left: var(--w-hair) dashed var(--warn); border-right: var(--w-hair) dashed var(--warn);
             background: rgba(224, 138, 30, .10); pointer-events: none; }
.bgc-spot { position: absolute; transform: translate(-50%, -50%); z-index: 2;
            padding: 0 calc(var(--px) * 3); font-size: .8rem; font-weight: 800;
            color: var(--ink-on-dark); background: var(--ui); border: var(--w-frame) solid var(--ui-edge); }
</style>
</head>
<body>
<div class="bgc">
  <h1 style="margin:0 0 calc(var(--px)*3);font-size:1.3rem;">背景の確認台 — 街・商店街・事務所</h1>
  <p class="note">
    デザインプロジェクトから取り込んだ4枚。<strong>960×540 をコードで描いて整数倍</strong>しています（画像ファイルではありません）。
    橙の帯＝<strong>手前にパネルが載る中央58%</strong>。ここに見せ場が入っていないかを見ます。
    街の札＝押せる場所（<code>bg.ts</code> の <code>TOWN_SPOTS</code>）。
  </p>
  <div id="list"></div>
</div>
<script src="bg/lib.js"></script>
<script src="bg/town.js"></script>
<script src="bg/arcade.js"></script>
<script src="bg/office.js"></script>
<script type="module" src="js/web/bgcheck.js"></script>
</body>
</html>
