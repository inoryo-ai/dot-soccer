# ドットサッカー育成ゲーム — 開発ツールの設定
#
# 🔴 「標準ライブラリのみ」は**実行時**の制約（README）。
#    ruff / mypy は開発ツールで、ゲームを動かすのに要らない。
#    この切り分けを最初にしていなかったため、lint と型チェックが
#    ループ#1・#2 と2回続けて持ち越された（台帳の昇格ルールで今回が機械化の期限）。
#
# 🔑 検査は `python scripts/check_project.py` から呼ばれる。
#    人が思い出して打つものにしない。

[project]
name = "dot-soccer"
version = "0.1.0"
description = "ドットサッカー育成ゲーム（MVP・コマンド版）"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
# 日本語のコメントと docstring が多い。88 だと説明が途切れて読めなくなる
line-length = 100
# 🔑 `web/dist` は `sim/` の写し（配信用に組み立て直したもの）。
#    正本と同じ内容を二重に検査すると、同じ指摘が2回出て意味が薄れる
extend-exclude = ["out", "logs", "saves", "web/dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle warning
  "F",    # pyflakes（未使用・未定義）
  "I",    # import の並び
  "UP",   # 古い書き方
  "B",    # bugbear（黙って壊れる書き方）
  "SIM",  # 冗長な条件分岐
  "C4",   # 内包表記
  "RET",  # return の一貫性
  "ARG",  # 使われていない引数
  "PTH",  # os.path ではなく pathlib
  "RUF",  # ruff 固有（RUF001-003 は全角記号の誤検出源なので下で外す）
]
ignore = [
  # 🔑 日本語の文章に全角の括弧・コロン・読点が入るのは**正しい**。
  #    RUF001-003 は「紛らわしい Unicode」として全部拾ってしまう
  "RUF001",
  "RUF002",
  "RUF003",
  # 🔑 `__all__` と `__slots__` の並びは**意味の順**にしてある
  #    （選手の所属 → 定位置 → 現在位置 → スタミナ → 重み）。
  #    アルファベット順に直すと、読んだときに構造が見えなくなる
  "RUF022",
  "RUF023",
]

[tool.ruff.lint.per-file-ignores]
# テストは長い定数表と組み合わせの列挙が本体。行長で折ると読めなくなる
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["sim", "scripts", "tests", "web"]
# 🔴 `web/dist` を外す。`sim/` の写しなので、外さないと
#    「同じモジュールが2か所にある」で型チェック自体が止まる
exclude = "(out|logs|saves|web/dist)/"

# 🔴 ここを緩めるときは理由を書くこと。黙って緩めると型チェックは飾りになる
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# 🔑 注釈の完全強制（disallow_untyped_defs）はまだ入れない。
#    4,000行に一気に入れると、直すことが目的になって**故障の検出が後回し**になる。
#    まず「書いてある注釈が嘘をついていないか」を見る段階に置く。
#    → 残課題: モジュール単位で段階的に厳しくする（sim/model.py から）
disallow_untyped_defs = false

[tool.pytest.ini_options]
# 🔑 遅い検査（3シーズン通し・約100秒）に印を付ける。
#    普段は `pytest -m "not slow"` で回し、出す前は全部回す。
#    台帳（天城）「テストの実行時間の劣化を放置しない」への対応。
#    ただし**既定では全部回す**（印を付けただけで外すと、そのうち誰も回さなくなる）。
markers = [
    "slow: 1件で1分以上かかる検査（通しシーズンなど）",
]
